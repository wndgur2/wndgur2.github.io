<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
  }
  .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
  .ln{stroke:var(--sub);stroke-width:1.5;fill:none} .al{stroke:var(--accent);stroke-width:1.8;fill:none}
  .ret{stroke:var(--sub);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
  .life{stroke:var(--line);stroke-width:1.5;fill:none;stroke-dasharray:4 5}
  .pass{fill:var(--bg);stroke:var(--sub);stroke-width:1.5}
  .ms{fill:var(--sub)} .ma{fill:var(--accent)}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ms" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ma" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="800" height="510" rx="16"/>

<!-- lifelines -->
<line class="life" x1="210" y1="76" x2="210" y2="436"/>
<line class="life" x1="450" y1="76" x2="450" y2="490"/>
<line class="life" x1="680" y1="76" x2="680" y2="490"/>

<!-- headers -->
<rect class="box" x="125" y="28" width="170" height="48" rx="12"/>
<text class="t" x="210" y="50" font-size="15" text-anchor="middle" font-weight="600">클라이언트</text>
<text class="s" x="210" y="68" font-size="13" text-anchor="middle">React hook</text>
<rect class="box" x="365" y="28" width="170" height="48" rx="12"/>
<text class="t" x="450" y="50" font-size="15" text-anchor="middle" font-weight="600">MessagesGateway</text>
<text class="s" x="450" y="68" font-size="13" text-anchor="middle">room chatroom_{id}</text>
<rect class="box" x="595" y="28" width="170" height="48" rx="12"/>
<text class="t" x="680" y="50" font-size="15" text-anchor="middle" font-weight="600">NestJS 서버</text>
<text class="s" x="680" y="68" font-size="13" text-anchor="middle">Controller · 생성 서비스</text>

<!-- joinRoom -->
<line class="ln" x1="210" y1="114" x2="446" y2="114" marker-end="url(#ah)"/>
<text class="s" x="330" y="106" font-size="13" text-anchor="middle">joinRoom { chatroomId }</text>

<!-- POST -->
<line class="ln" x1="210" y1="160" x2="676" y2="160" marker-end="url(#ah)"/>
<rect class="bg" x="334" y="138" width="222" height="18"/>
<text class="t" x="445" y="152" font-size="13" text-anchor="middle">POST /api/chatrooms/:id/messages</text>

<!-- 202 -->
<line class="ret" x1="680" y1="200" x2="214" y2="200" marker-end="url(#ah)"/>
<rect class="bg" x="350" y="178" width="190" height="18"/>
<text class="s" x="445" y="192" font-size="13" text-anchor="middle">202 Accepted · user message</text>

<!-- background generation -->
<rect class="box" x="595" y="220" width="170" height="48" rx="10"/>
<text class="t" x="680" y="241" font-size="13" text-anchor="middle">백그라운드 생성</text>
<text class="s" x="680" y="259" font-size="13" text-anchor="middle">Ollama delta 누적</text>

<!-- typing -->
<line class="ln" x1="680" y1="296" x2="214" y2="296" marker-end="url(#ah)"/>
<circle class="pass" cx="450" cy="296" r="4"/>
<text class="s" x="330" y="288" font-size="13" text-anchor="middle">ai_typing_state</text>
<text class="s" x="565" y="288" font-size="13" text-anchor="middle">setTyping</text>

<!-- chunks (cumulative) -->
<text class="s" x="565" y="320" font-size="13" text-anchor="middle">streamChunk(전체 문자열)</text>
<line class="al" x1="680" y1="328" x2="214" y2="328" marker-end="url(#aa)"/>
<circle class="pass" cx="450" cy="328" r="4"/>
<text class="a" x="330" y="320" font-size="13" text-anchor="middle">ai_message_chunk  "a"</text>
<line class="al" x1="680" y1="358" x2="214" y2="358" marker-end="url(#aa)"/>
<circle class="pass" cx="450" cy="358" r="4"/>
<text class="a" x="330" y="350" font-size="13" text-anchor="middle">ai_message_chunk  "ab"</text>
<line class="al" x1="680" y1="388" x2="214" y2="388" marker-end="url(#aa)"/>
<circle class="pass" cx="450" cy="388" r="4"/>
<text class="a" x="330" y="380" font-size="13" text-anchor="middle">ai_message_chunk  "abc"</text>
<path class="ln" d="M196,322 h-6 v72 h6"/>
<text class="s" x="182" y="352" font-size="13" text-anchor="end">streamingContent</text>
<text class="s" x="182" y="370" font-size="13" text-anchor="end">값을 교체</text>

<!-- complete -->
<line class="ln" x1="680" y1="424" x2="214" y2="424" marker-end="url(#ah)"/>
<circle class="pass" cx="450" cy="424" r="4"/>
<text class="t" x="330" y="416" font-size="13" text-anchor="middle">ai_message_complete</text>
<text class="s" x="565" y="416" font-size="13" text-anchor="middle">content · messageId</text>

<!-- cache write -->
<rect class="hl" x="100" y="440" width="220" height="48" rx="10"/>
<text class="t" x="210" y="461" font-size="13" text-anchor="middle">setQueryData</text>
<text class="s" x="210" y="479" font-size="13" text-anchor="middle">메시지 캐시에 추가 (refetch 없음)</text>
</svg>
