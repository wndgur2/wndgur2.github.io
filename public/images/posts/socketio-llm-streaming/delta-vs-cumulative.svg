<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
  }
  .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .lost{fill:none;stroke:var(--sub);stroke-width:1.5;stroke-dasharray:5 4}
  .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
  .ln{stroke:var(--sub);stroke-width:1.5;fill:none} .sep{stroke:var(--line);stroke-width:1.5;fill:none}
  .ms{fill:var(--sub)}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ms" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="800" height="310" rx="16"/>

<!-- column headers -->
<text class="s" x="265" y="46" font-size="13" text-anchor="middle">chunk 1</text>
<text class="s" x="375" y="46" font-size="13" text-anchor="middle">chunk 2</text>
<text class="s" x="485" y="46" font-size="13" text-anchor="middle">chunk 3</text>
<text class="s" x="680" y="46" font-size="13" text-anchor="middle">클라이언트 화면</text>

<!-- row 1: delta -->
<text class="t" x="40" y="96" font-size="15" font-weight="600">delta (이전)</text>
<text class="s" x="40" y="116" font-size="13">old + chunk 로 이어 붙임</text>
<rect class="box" x="220" y="80" width="90" height="40" rx="10"/>
<text class="t" x="265" y="105" font-size="15" text-anchor="middle">"a"</text>
<rect class="lost" x="330" y="80" width="90" height="40" rx="10"/>
<text class="s" x="375" y="105" font-size="15" text-anchor="middle">"b"</text>
<text class="s" x="375" y="140" font-size="13" text-anchor="middle">유실</text>
<rect class="box" x="440" y="80" width="90" height="40" rx="10"/>
<text class="t" x="485" y="105" font-size="15" text-anchor="middle">"c"</text>
<line class="ln" x1="544" y1="100" x2="592" y2="100" marker-end="url(#ah)"/>
<rect class="box" x="600" y="72" width="160" height="56" rx="12"/>
<text class="t" x="680" y="97" font-size="15" text-anchor="middle">"ac"</text>
<text class="s" x="680" y="116" font-size="13" text-anchor="middle">b가 빠진 채 남는다</text>

<line class="sep" x1="40" y1="160" x2="760" y2="160"/>

<!-- row 2: cumulative -->
<text class="t" x="40" y="196" font-size="15" font-weight="600">누적값 (현재)</text>
<text class="s" x="40" y="216" font-size="13">chunk 로 교체</text>
<rect class="box" x="220" y="180" width="90" height="40" rx="10"/>
<text class="t" x="265" y="205" font-size="15" text-anchor="middle">"a"</text>
<rect class="lost" x="330" y="180" width="90" height="40" rx="10"/>
<text class="s" x="375" y="205" font-size="15" text-anchor="middle">"ab"</text>
<text class="s" x="375" y="240" font-size="13" text-anchor="middle">유실</text>
<rect class="box" x="440" y="180" width="90" height="40" rx="10"/>
<text class="t" x="485" y="205" font-size="15" text-anchor="middle">"abc"</text>
<line class="ln" x1="544" y1="200" x2="592" y2="200" marker-end="url(#ah)"/>
<rect class="hl" x="600" y="172" width="160" height="56" rx="12"/>
<text class="a" x="680" y="197" font-size="15" text-anchor="middle" font-weight="600">"abc"</text>
<text class="s" x="680" y="216" font-size="13" text-anchor="middle">다음 chunk로 맞춰진다</text>

<!-- trade-off -->
<text class="s" x="40" y="280" font-size="13">대신 chunk 하나의 크기가 응답 길이만큼 커지고, 전체 전송량은 길이의 제곱에 비례한다.</text>
</svg>
