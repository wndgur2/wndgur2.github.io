<svg xmlns="http://www.w3.org/2000/svg" width="800" height="328" viewBox="0 0 800 328" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <style>
    :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
    }
    .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
    .ln{stroke:var(--sub);stroke-width:1.5;fill:none} .al{stroke:var(--accent);stroke-width:1.8;fill:none}
    .ah{fill:var(--sub)} .aah{fill:var(--accent)}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="800" height="328" rx="16"/>

  <!-- 상태 -->
  <rect class="box" x="32" y="140" width="190" height="68" rx="12"/>
  <text class="t" x="127" y="169" font-size="15" font-weight="600" text-anchor="middle">본딩 없음</text>
  <text class="s" x="127" y="191" font-size="13" text-anchor="middle">새 기기 · UNPAIR 뒤</text>

  <rect class="box" x="305" y="140" width="190" height="68" rx="12"/>
  <text class="t" x="400" y="169" font-size="15" font-weight="600" text-anchor="middle">본딩된 폰 1대</text>
  <text class="s" x="400" y="191" font-size="13" text-anchor="middle">그 폰의 암호화 연결만</text>

  <rect class="hl" x="578" y="140" width="190" height="68" rx="12"/>
  <text class="t" x="673" y="169" font-size="15" font-weight="600" text-anchor="middle">페어링 창 120초</text>
  <text class="s" x="673" y="191" font-size="13" text-anchor="middle">기기를 켠 직후에만</text>

  <!-- 없음 → 1대 -->
  <path class="ln" d="M170,140 Q263,62 352,138" marker-end="url(#arr)"/>
  <text class="t" x="263" y="60" font-size="15" text-anchor="middle">LESC 페어링</text>
  <text class="s" x="263" y="80" font-size="13" text-anchor="middle">언제나 받음</text>

  <!-- 1대 → 없음 -->
  <path class="ln" d="M352,208 Q263,286 172,210" marker-end="url(#arr)"/>
  <text class="t" x="263" y="280" font-size="15" text-anchor="middle">UNPAIR (op 7)</text>
  <text class="s" x="263" y="300" font-size="13" text-anchor="middle">기기가 모든 본딩 삭제</text>

  <!-- 1대 → 창 -->
  <path class="al" d="M448,140 Q536,62 624,138" marker-end="url(#arrA)"/>
  <text class="a" x="536" y="60" font-size="15" font-weight="600" text-anchor="middle">기기 껐다 켜기</text>
  <text class="s" x="536" y="80" font-size="13" text-anchor="middle">기존 본딩은 그대로</text>

  <!-- 창 → 1대 -->
  <path class="ln" d="M624,208 Q536,286 450,210" marker-end="url(#arr)"/>
  <text class="t" x="536" y="280" font-size="15" text-anchor="middle">새 본딩 성공 · 120초 경과</text>
  <text class="s" x="536" y="300" font-size="13" text-anchor="middle">창 닫힘, 이전 본딩은 성공 뒤 삭제</text>
</svg>
