<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
  }
  .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
  .ln{stroke:var(--sub);stroke-width:1.5;fill:none} .al{stroke:var(--accent);stroke-width:1.8;fill:none}
  .life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}
  .dash{stroke-dasharray:6 4}
  .b{font-weight:600}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--sub)"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
</defs>
<rect class="bg" width="800" height="470" rx="16"/>

<!-- lifelines -->
<line class="life" x1="110" y1="80" x2="110" y2="444"/>
<line class="life" x1="320" y1="80" x2="320" y2="444"/>
<line class="life" x1="530" y1="80" x2="530" y2="444"/>
<line class="life" x1="708" y1="80" x2="708" y2="444"/>

<!-- headers -->
<rect class="box" x="35" y="24" width="150" height="56" rx="10"/>
<text class="t b" x="110" y="58" font-size="15" text-anchor="middle">클라이언트</text>
<rect class="box" x="245" y="24" width="150" height="56" rx="10"/>
<text class="t b" x="320" y="48" font-size="15" text-anchor="middle">Edge Function</text>
<text class="s" x="320" y="68" font-size="13" text-anchor="middle">chat</text>
<rect class="box" x="455" y="24" width="150" height="56" rx="10"/>
<text class="t b" x="530" y="48" font-size="15" text-anchor="middle">Postgres</text>
<text class="s" x="530" y="68" font-size="13" text-anchor="middle">RLS 적용</text>
<rect class="box" x="640" y="24" width="136" height="56" rx="10"/>
<text class="t b" x="708" y="58" font-size="15" text-anchor="middle">LLM</text>

<!-- 1 request -->
<line class="ln" x1="110" y1="114" x2="316" y2="114" marker-end="url(#arr)"/>
<text class="s" x="215" y="105" font-size="13" text-anchor="middle">요청 + JWT</text>
<text class="s" x="330" y="142" font-size="13">JWT로 사용자 확인</text>

<!-- 2 load feedback -->
<line class="ln" x1="320" y1="178" x2="526" y2="178" marker-end="url(#arr)"/>
<text class="s" x="425" y="169" font-size="13" text-anchor="middle">사용자 스코프로 피드백 로드</text>
<line class="ln dash" x1="530" y1="210" x2="324" y2="210" marker-end="url(#arr)"/>
<text class="s" x="425" y="201" font-size="13" text-anchor="middle">본인 피드백만</text>

<!-- 3 llm -->
<line class="ln" x1="320" y1="250" x2="704" y2="250" marker-end="url(#arr)"/>
<text class="s" x="619" y="241" font-size="13" text-anchor="middle">프롬프트 + 툴</text>
<line class="ln dash" x1="708" y1="282" x2="324" y2="282" marker-end="url(#arr)"/>
<text class="s" x="619" y="273" font-size="13" text-anchor="middle">텍스트 + 툴 호출</text>

<!-- 4 proposal -->
<line class="al" x1="320" y1="322" x2="114" y2="322" marker-end="url(#arrA)"/>
<text class="a" x="215" y="313" font-size="13" text-anchor="middle">텍스트 + proposal</text>

<!-- 5 confirm -->
<rect class="hl" x="40" y="340" width="140" height="44" rx="10"/>
<text class="t b" x="110" y="367" font-size="15" text-anchor="middle">확인 칩</text>

<!-- 6 commit -->
<line class="al" x1="110" y1="420" x2="526" y2="420" marker-end="url(#arrA)"/>
<text class="a" x="215" y="411" font-size="13" text-anchor="middle">RLS mutation으로 반영</text>

<text class="s" x="330" y="360" font-size="13">함수는 DB를 직접 바꾸지 않는다</text>
</svg>
