<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
  }
  .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
  .ln{stroke:var(--sub);stroke-width:1.5;fill:none} .al{stroke:var(--accent);stroke-width:1.8;fill:none}
  .grp{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
  .b{font-weight:600}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--sub)"/></marker>
</defs>
<rect class="bg" width="800" height="430" rx="16"/>

<!-- client -->
<rect class="box" x="24" y="66" width="180" height="304" rx="12"/>
<text class="t b" x="114" y="98" font-size="17" text-anchor="middle">Expo 앱</text>
<text class="s" x="114" y="120" font-size="13" text-anchor="middle">React Native · TS</text>
<rect class="box" x="40" y="142" width="148" height="62" rx="10"/>
<text class="t" x="114" y="168" font-size="15" text-anchor="middle">Android</text>
<text class="s" x="114" y="190" font-size="13" text-anchor="middle">EAS Build</text>
<rect class="box" x="40" y="220" width="148" height="62" rx="10"/>
<text class="t" x="114" y="246" font-size="15" text-anchor="middle">웹 (PWA)</text>
<text class="s" x="114" y="268" font-size="13" text-anchor="middle">Vercel</text>
<text class="s" x="114" y="316" font-size="13" text-anchor="middle">같은 소스를</text>
<text class="s" x="114" y="336" font-size="13" text-anchor="middle">react-native-web으로</text>
<text class="s" x="114" y="356" font-size="13" text-anchor="middle">웹 export</text>

<!-- supabase group -->
<rect class="grp" x="340" y="28" width="220" height="378" rx="14"/>
<text class="s b" x="358" y="52" font-size="13">Supabase</text>
<rect class="box" x="360" y="66" width="180" height="54" rx="10"/>
<text class="t" x="450" y="99" font-size="15" text-anchor="middle">Auth</text>
<rect class="hl" x="360" y="170" width="180" height="70" rx="10"/>
<text class="t b" x="450" y="200" font-size="15" text-anchor="middle">Postgres + RLS</text>
<text class="s" x="450" y="222" font-size="13" text-anchor="middle">본인 행만 접근</text>
<rect class="hl" x="360" y="300" width="180" height="70" rx="10"/>
<text class="t b" x="450" y="330" font-size="15" text-anchor="middle">Edge Function chat</text>
<text class="s" x="450" y="352" font-size="13" text-anchor="middle">LLM 키는 여기에만</text>

<!-- LLM -->
<rect class="box" x="630" y="290" width="146" height="90" rx="12"/>
<text class="t b" x="703" y="318" font-size="15" text-anchor="middle">LLM 프로바이더</text>
<text class="s" x="703" y="342" font-size="13" text-anchor="middle">Gemini (기본)</text>
<text class="s" x="703" y="362" font-size="13" text-anchor="middle">Anthropic · OpenAI</text>

<!-- arrows client -> supabase -->
<line class="ln" x1="204" y1="93" x2="356" y2="93" marker-end="url(#arr)"/>
<text class="s" x="280" y="84" font-size="13" text-anchor="middle">로그인</text>
<line class="ln" x1="204" y1="205" x2="356" y2="205" marker-end="url(#arr)"/>
<text class="s" x="280" y="196" font-size="13" text-anchor="middle">CRUD 직접</text>
<line class="ln" x1="204" y1="335" x2="356" y2="335" marker-end="url(#arr)"/>
<text class="s" x="280" y="326" font-size="13" text-anchor="middle">채팅 (SSE)</text>

<!-- edge -> postgres -->
<line class="ln" x1="410" y1="300" x2="410" y2="244" marker-end="url(#arr)"/>
<text class="s" x="420" y="276" font-size="13">피드백 조회 · RLS 적용</text>

<!-- edge -> llm -->
<line class="ln" x1="540" y1="335" x2="626" y2="335" marker-end="url(#arr)"/>
<text class="s" x="585" y="326" font-size="13" text-anchor="middle">호출</text>
</svg>
