<svg xmlns="http://www.w3.org/2000/svg" width="800" height="406" viewBox="0 0 800 406" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
  }
  .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
  .ln{stroke:var(--line);stroke-width:1.5;fill:none} .al{stroke:var(--accent);stroke-width:1.8;fill:none}
  .sl{stroke:var(--sub);stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4} .ghost{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
  .ms{fill:var(--sub)} .ma{fill:var(--accent)}
  text{font-size:15px} .sm{font-size:13px} .ti{font-size:17px;font-weight:700} .b{font-weight:600}
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ms"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ma"/></marker>
</defs>
<rect class="bg" width="800" height="406" rx="16"/>
<text x="32" y="46" class="t ti" text-anchor="start">복사해야 할 것은 두 층이다</text><text x="32" y="70" class="s sm" text-anchor="start">선택한 턴까지 두 층을 모두 새 대화로 복사하고, 원본은 건드리지 않는다</text><text x="356" y="106" class="t b" text-anchor="middle">원본 대화</text><text x="622" y="106" class="t b" text-anchor="middle">새 대화</text><rect x="24" y="122" width="752" height="92" rx="11" class="box" /><text x="44" y="154" class="t b" text-anchor="start">앱 대화 기록</text><text x="44" y="176" class="s sm" text-anchor="start">화면에 보이는 메시지</text><text x="44" y="195" class="s sm" text-anchor="start">첨부 · 도구 실행 카드</text><rect x="250" y="150" width="36" height="36" rx="8" class="box"/><text x="268" y="173" class="t sm" text-anchor="middle">1</text><rect x="294" y="150" width="36" height="36" rx="8" class="box"/><text x="312" y="173" class="t sm" text-anchor="middle">2</text><rect x="338" y="150" width="36" height="36" rx="8" class="box"/><text x="356" y="173" class="t sm" text-anchor="middle">3</text><rect x="382" y="150" width="36" height="36" rx="8" class="box"/><text x="400" y="173" class="s sm" text-anchor="middle">4</text><rect x="426" y="150" width="36" height="36" rx="8" class="box"/><text x="444" y="173" class="s sm" text-anchor="middle">5</text><line x1="470" y1="168" x2="546" y2="168" class="sl" marker-end="url(#ar)"/><text x="508" y="158" class="s sm" text-anchor="middle">메시지 복사</text><rect x="560" y="150" width="36" height="36" rx="8" class="hl"/><text x="578" y="173" class="a sm" text-anchor="middle">1</text><rect x="604" y="150" width="36" height="36" rx="8" class="hl"/><text x="622" y="173" class="a sm" text-anchor="middle">2</text><rect x="648" y="150" width="36" height="36" rx="8" class="hl"/><text x="666" y="173" class="a sm" text-anchor="middle">3</text><rect x="24" y="228" width="752" height="92" rx="11" class="box" /><text x="44" y="260" class="t b" text-anchor="start">에이전트 세션 기억</text><text x="44" y="282" class="s sm" text-anchor="start">모델이 보는 문맥</text><text x="44" y="301" class="s sm" text-anchor="start">도구 호출·결과 · 파일 참조</text><rect x="250" y="256" width="36" height="36" rx="8" class="box"/><text x="268" y="279" class="t sm" text-anchor="middle">1</text><rect x="294" y="256" width="36" height="36" rx="8" class="box"/><text x="312" y="279" class="t sm" text-anchor="middle">2</text><rect x="338" y="256" width="36" height="36" rx="8" class="box"/><text x="356" y="279" class="t sm" text-anchor="middle">3</text><rect x="382" y="256" width="36" height="36" rx="8" class="box"/><text x="400" y="279" class="s sm" text-anchor="middle">4</text><rect x="426" y="256" width="36" height="36" rx="8" class="box"/><text x="444" y="279" class="s sm" text-anchor="middle">5</text><line x1="470" y1="274" x2="546" y2="274" class="sl" marker-end="url(#ar)"/><text x="508" y="264" class="s sm" text-anchor="middle">fork API</text><rect x="560" y="256" width="36" height="36" rx="8" class="hl"/><text x="578" y="279" class="a sm" text-anchor="middle">1</text><rect x="604" y="256" width="36" height="36" rx="8" class="hl"/><text x="622" y="279" class="a sm" text-anchor="middle">2</text><rect x="648" y="256" width="36" height="36" rx="8" class="hl"/><text x="666" y="279" class="a sm" text-anchor="middle">3</text><line x1="378" y1="124" x2="378" y2="330" class="al dash"/><text x="378" y="350" class="a sm" text-anchor="middle">분기점: 완료된 턴까지만</text><text x="400" y="382" class="s sm" text-anchor="middle">앱 기록만 복사하면 화면은 같아 보여도 모델은 아무것도 기억하지 못한다</text>
</svg>
