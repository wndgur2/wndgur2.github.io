<svg xmlns="http://www.w3.org/2000/svg" width="800" height="416" viewBox="0 0 800 416" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<style>
  :root { --bg:#f7f7f9; --surface:#ffffff; --line:#d3d3db; --text:#24242a; --sub:#6b6b75; --accent:#2e5cf0; --accent-soft:#2e5cf01f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d23; --surface:#282830; --line:#44444f; --text:#f2f2f5; --sub:#a3a3ad; --accent:#8f7aff; --accent-soft:#8f7aff26; }
  }
  .bg{fill:var(--bg)} .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .t{fill:var(--text)} .s{fill:var(--sub)} .a{fill:var(--accent)}
  .ln{stroke:var(--line);stroke-width:1.5;fill:none} .al{stroke:var(--accent);stroke-width:1.8;fill:none}
  .sl{stroke:var(--sub);stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4} .ghost{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
  .ms{fill:var(--sub)} .ma{fill:var(--accent)}
  text{font-size:15px} .sm{font-size:13px} .ti{font-size:17px;font-weight:700} .b{font-weight:600}
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ms"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ma"/></marker>
</defs>
<rect class="bg" width="800" height="416" rx="16"/>
<text x="32" y="46" class="t ti" text-anchor="start">공유 DB를 쓰는 preview가 예약을 집어 갔다</text><text x="32" y="70" class="s sm" text-anchor="start">모든 컨테이너가 부팅 때 예약 스윕을 켜고, 집은 예약을 자기 코드로 실행한다</text><rect x="24" y="88" width="364" height="304" rx="11" class="box" /><rect x="412" y="88" width="364" height="304" rx="11" class="box" /><text x="206" y="116" class="t b" text-anchor="middle">전</text><text x="594" y="116" class="t b" text-anchor="middle">후</text><rect x="34" y="134" width="82" height="56" rx="11" class="box" /><text x="75" y="167" class="t sm b" text-anchor="middle">본 서비스</text><rect x="122" y="134" width="82" height="56" rx="11" class="box" /><text x="163" y="167" class="t sm b" text-anchor="middle">preview</text><rect x="210" y="134" width="82" height="56" rx="11" class="box" /><text x="251" y="167" class="t sm b" text-anchor="middle">preview</text><rect x="298" y="134" width="82" height="56" rx="11" class="box" /><text x="339" y="157.5" class="t sm b" text-anchor="middle">preview</text><text x="339" y="176.5" class="s sm" text-anchor="middle">옛 스키마</text><line x1="75" y1="192" x2="160" y2="248" class="sl" marker-end="url(#ar)"/><line x1="163" y1="192" x2="207" y2="248" class="sl" marker-end="url(#ar)"/><line x1="251" y1="192" x2="254" y2="248" class="sl" marker-end="url(#ar)"/><line x1="339" y1="192" x2="300" y2="248" class="al" marker-end="url(#aa)"/><text x="352" y="226" class="a sm" text-anchor="middle">실패</text><path d="M87,262 a120,9 0 0,0 240,0 v52 a120,9 0 0,1 -240,0 z" class="box"/><ellipse cx="207" cy="262" rx="120" ry="9" class="box"/><text x="207" y="292" class="t sm b" text-anchor="middle">테스트 환경 DB</text><text x="207" y="310" class="s sm" text-anchor="middle">예약</text><text x="206" y="350" class="s sm" text-anchor="middle">예약 대부분을 preview가 집는다</text><text x="206" y="370" class="a sm" text-anchor="middle">옛 스키마 preview가 집은 예약은 실패</text><rect x="422" y="134" width="82" height="56" rx="11" class="box" /><text x="463" y="167" class="t sm b" text-anchor="middle">본 서비스</text><rect x="510" y="134" width="82" height="56" rx="11" class="box" /><text x="551" y="157.5" class="t sm b" text-anchor="middle">preview</text><text x="551" y="176.5" class="s sm" text-anchor="middle">공유 DB</text><rect x="598" y="134" width="82" height="56" rx="11" class="box" /><text x="639" y="157.5" class="t sm b" text-anchor="middle">preview</text><text x="639" y="176.5" class="s sm" text-anchor="middle">공유 DB</text><rect x="686" y="134" width="82" height="56" rx="11" class="box" /><text x="727" y="157.5" class="t sm b" text-anchor="middle">preview</text><text x="727" y="176.5" class="s sm" text-anchor="middle">격리 DB</text><line x1="463" y1="192" x2="500" y2="248" class="sl" marker-end="url(#ar)"/><text x="551" y="214" class="a sm" text-anchor="middle">스윕 끔</text><text x="639" y="214" class="a sm" text-anchor="middle">스윕 끔</text><line x1="727" y1="192" x2="727" y2="248" class="sl" marker-end="url(#ar)"/><path d="M436,262 a110,9 0 0,0 220,0 v52 a110,9 0 0,1 -220,0 z" class="box"/><ellipse cx="546" cy="262" rx="110" ry="9" class="box"/><text x="546" y="292" class="t sm b" text-anchor="middle">테스트 환경 DB</text><text x="546" y="310" class="s sm" text-anchor="middle">예약</text><path d="M689,262 a38,9 0 0,0 76,0 v52 a38,9 0 0,1 -76,0 z" class="box"/><ellipse cx="727" cy="262" rx="38" ry="9" class="box"/><text x="727" y="292" class="t sm b" text-anchor="middle">격리 DB</text><text x="594" y="352" class="s sm" text-anchor="middle">격리 DB preview는 스케줄러를 시험할 수 있다</text>
</svg>
