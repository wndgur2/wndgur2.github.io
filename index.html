<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon-light.ico" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- seo:head:start -->
  <title>이중혁 블로그</title>
  <meta name="description" content="이중혁 기술 블로그" />
  <link rel="canonical" href="https://wndgur2.github.io/" />
  <meta property="og:site_name" content="이중혁 블로그" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="이중혁 블로그" />
  <meta property="og:description" content="이중혁 기술 블로그" />
  <meta property="og:url" content="https://wndgur2.github.io/" />
  <!-- seo:head:end -->
  <script>
    // 첫 렌더 전에 테마를 정해 깜빡임을 막는다. 규칙은 src/utils/theme.ts와 같다.
    (function () {
      var theme
      try {
        theme = localStorage.getItem('theme')
      } catch (e) { }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    })()
  </script>
  <style>
    /*
     * CSS가 로드되기 전 첫 화면의 배경. src/styles/tokens.css의 --color-bg와 같은 값이다.
     * :where()로 우선순위를 0으로 두어 CSS가 로드되면 index.css의 html 규칙이 덮어쓴다.
     */
    :where(html[data-theme="light"]) {
      background-color: #fafafa;
    }

    :where(html[data-theme="dark"]) {
      background-color: #161619;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet">
  </noscript>
</head>

<body>
  <!-- seo:body:start -->
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- seo:body:end -->
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
