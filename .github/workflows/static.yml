name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Install pnpm (per official guidance)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2) Setup Node and enable pnpm cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # 3) Install deps
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4) Lint + typecheck + tests
      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      # 5) Restore mirrored images so unchanged ones are not downloaded again
      - name: Restore mirrored images
        uses: actions/cache@v4
        with:
          path: public/media
          key: post-media-${{ github.run_id }}
          restore-keys: post-media-

      # 6) Generate static content
      - name: Generate static content (Octokit)
        env:
          # 콘텐츠 레포가 모두 공개라 자동 발급 토큰으로 충분하다 (만료 관리 불필요)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_OWNER: wndgur2
          BLOG_DB_REPO: wndgur2/dev-log
          BLOG_DB_REF: main
          POSTS_DIR: posts
        run: pnpm exec node scraper/scripts/fetch-content.js

      # 7) Build your site
      - name: Build site
        run: pnpm build

      # 8) Deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
